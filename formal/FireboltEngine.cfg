\* TLC model-checking configuration for FireboltEngine.tla
\*
\* Run with:
\*   java -jar tla2tools.jar -config FireboltEngine.cfg FireboltEngine.tla
\*
\* Or in the TLA+ Toolbox: File > Open Spec, then Model > New Model.
\*
\* Bounds:
\*   MaxGen=3  gives generations 0..3 (covers 3 full rollouts)
\*   MaxSpec=4 gives spec versions 0..4 (covers 3 spec changes mid-creating)
\*
\* Expected TLC runtime: ~2 seconds on a laptop. The deeper bounds explore
\* 12,952 distinct states (vs 6,476 before presetReady) for negligible extra
\* time, so there is no separate "shallow vs deep" config. 6,476 was measured
\* 2026-07-28 after classReady; 12,952 was measured 2026-08-24 after
\* presetReady. Each independent scheduling gate roughly doubles the space.

CONSTANTS
    MaxGen = 3
    MaxSpec = 4
    \* Every counterexample flag is FALSE here: this config checks the design as
    \* it ships. Each one has a FireboltEngineNaive*.cfg that flips it and pins
    \* the resulting violation; see formal/counterexamples.tsv.
    SwitchWithoutService = FALSE
    GCIgnoresActiveGen = FALSE
    GCDrainingGeneration = FALSE
    GCIgnoresGenerationFloor = FALSE
    AdvanceWithoutMatchingSTS = FALSE
    DriftDuringDrain = FALSE

SPECIFICATION Spec

INVARIANTS
    Safety

PROPERTIES
    EventuallyTerminal
    NoDeleteOfCurrentGeneration
