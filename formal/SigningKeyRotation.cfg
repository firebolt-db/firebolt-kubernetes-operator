\* TLC model-checking configuration for SigningKeyRotation.tla
\*
\* Run with:
\*   java -jar tla2tools.jar -config SigningKeyRotation.cfg SigningKeyRotation.tla
\*
\* Bounds:
\*   Engines = {e1, e2} exercises the lagging-engine interleavings the
\*     convergence gates exist for; a third engine adds interleavings but no
\*     new gate structure.
\*   MaxGen = 3 covers two full back-to-back rotations (1->2, 2->3),
\*     including the re-arm of rotationDue after a completed cycle.
\*
\* Expected TLC runtime: < 5 seconds.

CONSTANTS
    Engines = {e1, e2}
    MaxGen = 3

SPECIFICATION Spec

INVARIANTS
    Safety

PROPERTIES
    RotationCompletes
