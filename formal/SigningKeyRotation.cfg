\* TLC model-checking configuration for SigningKeyRotation.tla — the shipped
\* design, which must pass.
\*
\* Run with:
\*   java -jar tla2tools.jar -config SigningKeyRotation.cfg SigningKeyRotation.tla
\*
\* Bounds:
\*   Engines = {e1, e2}  two engines is the minimal witness for a validation gap,
\*                       which is a sign-here/validate-there property: one engine
\*                       lagging and one rolled.
\*   MaxGen  = 2         two full rotations, enough for a key to be minted,
\*                       promoted, retained, removed, and for the next rotation
\*                       to start on top of that.
\*
\* AnchorAtDemotion = FALSE selects the shipped retain-window anchor
\* (RetireEligibleAt, stamped at confirmed post-promotion convergence). See
\* SigningKeyRotationNaive.cfg for the counterexample the alternative produces.

CONSTANTS
    Engines = {e1, e2}
    MaxGen = 2
    AnchorAtDemotion = FALSE

SPECIFICATION Spec

\* The terminal state — MaxGen rotations done, one key left, every engine
\* converged — has no successors by construction. That is the goal state
\* EventuallyRotates asserts we reach, not a stuck reconciler.
CHECK_DEADLOCK FALSE

INVARIANTS
    Safety

PROPERTIES
    EventuallyRotates
