\* TLC configuration for EngineWake.tla with the stopped early return moved ABOVE
\* the wake check -- this configuration MUST FAIL.
\*
\* StoppedBeforeWake = TRUE models the precedence that reads correctly and is
\* fatal: "the engine is stopped, so there is nothing to decide". An auto-stopped
\* engine IS an engine at zero replicas, so that branch swallows every wake and
\* the feature cannot work at all -- the engine stays parked no matter how many
\* queries arrive for it. TLC reports:
\*
\*   Temporal property WakeIsNotLost was violated.
\*
\* This is why the wake check sits above the `spec.replicas == 0` return in
\* computeAutoStopDecision rather than below it, and the cost of that ordering is
\* deliberate: the decision function cannot tell an engine auto-stop parked from
\* one a user zeroed by hand, and a query restarts either. Users who want an
\* engine to stay down set autoStop.enabled: false, which returns before wake is
\* ever consulted.
\*
\* Only WakeIsNotLost is listed. Safety still holds under this flag -- an engine
\* that never starts violates no invariant, which is exactly why a liveness
\* property is what pins this one.
\*
\* CHECK_DEADLOCK FALSE for the same reason as the shipped config: the clock is
\* bounded.

CONSTANTS
    MaxTime = 3
    WakeTTL = 2
    Retention = 3
    IdleTimeout = 2
    ActiveReplicas = 1
    IdleReplicas = 0
    UserReplicas = 2
    StoppedBeforeWake = TRUE
    WakeIgnoresTTL = FALSE
    PollIgnoresReplicas = FALSE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

PROPERTIES
    WakeIsNotLost
