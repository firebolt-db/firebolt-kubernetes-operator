\* TLC model-checking configuration for WakeAgentHold.tla -- the shipped design,
\* which must pass.
\*
\* Run with:
\*   java -jar tla2tools.jar -config WakeAgentHold.cfg WakeAgentHold.tla
\*
\* Bounds, both of them minimal witnesses rather than round numbers:
\*
\*   Holds = {h1, h2}  the hazard needs one request exiting while ANOTHER is
\*                     parked on a later channel generation, so a single request
\*                     cannot exhibit it.
\*   MaxChan = 2       and it needs exactly two generations: a release belonging
\*                     to generation 1 landing on generation 2. A third adds
\*                     states and no new shape.
\*
\* ReleaseByEngineName = FALSE selects the shipped release, keyed on channel
\* identity. See WakeAgentHoldNaiveNameRelease.cfg for the counterexample the
\* alternative produces.

CONSTANTS
    Holds = {h1, h2}
    MaxChan = 2
    ReleaseByEngineName = FALSE

SPECIFICATION Spec

\* With both requests finished, the engine ready and no channel generations
\* left, no action is enabled. That is the model's horizon, not a wedged agent.
CHECK_DEADLOCK FALSE

INVARIANTS
    Safety

PROPERTIES
    HoldLeavesPark
