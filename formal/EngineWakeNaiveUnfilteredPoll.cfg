\* TLC configuration for EngineWake.tla with the poller's stopped-engine filter
\* removed -- this configuration MUST FAIL.
\*
\* PollIgnoresReplicas = TRUE caches whatever demand the agents report, for every
\* engine. The agent stamps demand whenever an engine has no ready endpoints,
\* which also covers a RUNNING engine during a node drain, a rolling restart or
\* any other outage -- so the unfiltered cache holds actionable demand against an
\* engine nobody parked. Auto-stop honours wake above the idle check, so the next
\* decision pins that engine at ActiveReplicas: a hand-sized engine is scaled
\* DOWN in the middle of its own outage, and its idle timer is frozen for the TTL
\* on top. TLC reports:
\*
\*   Invariant Inv_DemandOnlyForStoppedEngines is violated.
\*
\* The filter belongs in the poller rather than in the decision function because
\* the decision function cannot make it: by the time it runs, a timestamp carries
\* no evidence of what the engine's replica count was when the demand was
\* stamped.
\*
\* Only Inv_DemandOnlyForStoppedEngines is listed, not Safety: with
\* `INVARIANTS Safety` TLC prints only "Invariant Safety is violated" with no
\* attribution, so the row could pass on a violation of some other conjunct.

CONSTANTS
    MaxTime = 3
    WakeTTL = 2
    Retention = 3
    IdleTimeout = 2
    ActiveReplicas = 1
    IdleReplicas = 0
    UserReplicas = 2
    StoppedBeforeWake = FALSE
    WakeIgnoresTTL = FALSE
    PollIgnoresReplicas = TRUE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
    Inv_DemandOnlyForStoppedEngines
