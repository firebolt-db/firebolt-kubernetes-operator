\* TLC configuration for FireboltEngine.tla with GC's draining-generation
\* exclusion REMOVED -- this configuration MUST FAIL.
\*
\* GCDrainingGeneration = TRUE drops `g # drainingGen` from GCOrphans, modelling
\* a keepGens set that holds only CurrentGeneration and ActiveGeneration.
\*
\* The draining generation is neither: the cutover has already moved activeGen to
\* the new generation, and currentGen moved before that. So the sweep deletes the
\* StatefulSet the drain is waiting on, in the one phase whose whole purpose is
\* to wait for that generation's pods to finish serving. TLC reports:
\*
\*   Invariant Inv_DrainingHasSTS is violated.
\*
\* Worth pinning because the conjunct only became reachable when the sweep
\* stopped being gated on a terminal phase: a terminal phase has nothing
\* draining, so under the old gate this guard could not be exercised at all.
\* What it costs in production is in-flight queries rather than a crash, which is
\* exactly the kind of loss an invariant catches and a smoke test does not:
\* computeCleaning finds nothing left to delete and moves straight to a terminal
\* phase, so the rollout looks clean.
\*
\* Only Inv_DrainingHasSTS is listed, not Safety. See formal/counterexamples.tsv.
\*
\* No PROPERTIES and CHECK_DEADLOCK FALSE: a spec that violates safety says
\* nothing useful about progress.

CONSTANTS
    MaxGen = 3
    MaxSpec = 4
    SwitchWithoutService = FALSE
    GCIgnoresActiveGen = FALSE
    GCDrainingGeneration = TRUE
    GCIgnoresGenerationFloor = FALSE
    AdvanceWithoutMatchingSTS = FALSE
    DriftDuringDrain = FALSE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
    Inv_DrainingHasSTS
