\* TLC configuration for FireboltInstance.tla with the readiness roll-up
\* NARROWED TO ONE COMPONENT -- this configuration MUST FAIL.
\*
\* RollupOneComponent = TRUE redefines AllReady to consult postgres alone,
\* the early-return bug the spec's design notes say the implementation avoids
\* (writeStatusAndPoll calls setInstanceReadyRollup even on early returns so
\* the phase reflects ALL three conditions). A ReconcileRun then writes
\* phase = ready while metadata or gateway is still down. TLC reports:
\*
\*   Action property PhaseReflectsComponents is violated.
\*
\* Only PhaseReflectsComponents is listed. Safety (TypeOK) still passes under
\* the mutation -- that is precisely the gap this negative control pins: a
\* type-correct spec whose roll-up checks one of three components. The
\* temporal properties EventuallyReady and ReadyIsStable also still pass,
\* because they are phrased in terms of AllReady and move with its definition;
\* they are deliberately omitted so the failure line is unambiguous for the
\* grep-based gate.
\*
\* CHECK_DEADLOCK FALSE for the same reason as the FireboltEngineNaive*.cfg
\* family: a spec that violates its postcondition says nothing useful about
\* progress.

CONSTANTS
    RollupOneComponent = TRUE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

PROPERTIES
    PhaseReflectsComponents
