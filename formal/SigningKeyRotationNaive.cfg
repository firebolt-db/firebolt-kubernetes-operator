\* TLC model-checking configuration for SigningKeyRotation.tla with the NAIVE
\* retain-window anchor — this configuration MUST FAIL.
\*
\* AnchorAtDemotion = TRUE starts the retain window at DemotedAt: the moment the
\* operator decided to stop signing with a key, rather than the moment the fleet
\* provably stopped. Every engine keeps signing with the demoted key until it
\* rolls onto the promoted config, so the window can elapse — and the key can be
\* dropped from render — while an engine is still minting tokens with it. TLC
\* reports:
\*
\*   Invariant NoValidationGap is violated.
\*
\* The `formal-check-counterexample` Make target requires exactly that line, so
\* the argument for anchoring at RetireEligibleAt stays machine-checked. If this
\* configuration ever starts passing, the shipped gate has been weakened or the
\* model no longer expresses the hazard, and the target fails loudly either way.
\*
\* Only NoValidationGap is listed: the other invariants hold under both anchors,
\* so naming just this one keeps the failure unambiguous. Liveness is not checked
\* — a spec that violates safety says nothing useful about progress.

CONSTANTS
    Engines = {e1, e2}
    MaxGen = 2
    AnchorAtDemotion = TRUE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
    NoValidationGap
