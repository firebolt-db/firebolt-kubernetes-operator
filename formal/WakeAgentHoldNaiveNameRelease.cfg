\* TLC configuration for WakeAgentHold.tla with the waiter release keyed on the
\* engine name alone -- this configuration MUST FAIL.
\*
\* ReleaseByEngineName = TRUE releases whatever registration currently sits under
\* the engine name, instead of the one the finishing request was actually handed.
\* That looks right as long as a name has one registration over its whole life. It
\* does not: the readiness watch retires a channel on the not-ready -> ready edge,
\* a later request registers a fresh one under the same name, and the earlier
\* request releases AFTER both -- the release is a deferred call. Keyed by name,
\* that stale release decrements, and at a refcount of one deletes, the new
\* generation's registration. The request parked on it is then registered
\* nowhere, so no readiness edge can ever close its channel: it sits until its own
\* timeout while the engine it was waiting for is up and serving. TLC reports:
\*
\*   Invariant Inv_NoStrandedWaiter is violated.
\*
\* The shipped release compares the channel identity and no-ops when it does not
\* match, which is what makes refcounts per channel generation rather than per
\* name.
\*
\* Only Inv_NoStrandedWaiter is listed. This flag also breaks HoldLeavesPark --
\* the stranded request never leaves "parked", since HoldExpires is deliberately
\* unfair -- and naming the invariant keeps the failure to one line and one
\* meaning. Liveness is not checked here at all: a spec that violates safety says
\* nothing useful about progress.

CONSTANTS
    Holds = {h1, h2}
    MaxChan = 2
    ReleaseByEngineName = TRUE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
    Inv_NoStrandedWaiter
