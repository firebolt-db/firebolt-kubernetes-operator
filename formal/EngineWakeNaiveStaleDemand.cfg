\* TLC configuration for EngineWake.tla with the wake TTL removed from the
\* decision guard -- this configuration MUST FAIL.
\*
\* WakeIgnoresTTL = TRUE acts on any demand timestamp the operator happens to
\* hold, rather than only on one fresh within the TTL. That is tempting because
\* the poller ALREADY drops entries it cannot see any more, so the cache looks
\* like it only ever holds current demand. It does not: the agent retains a stamp
\* for longer than the operator will act on it (Retention > WakeTTL, mirroring
\* ten minutes against five), precisely so a poll that failed can re-observe it.
\* Re-observing a retained stamp is therefore normal, and acting on one that has
\* aged past the TTL resurrects a wake whose client gave up minutes ago. TLC
\* reports:
\*
\*   Action property ScaleUpOnlyOnFreshDemand is violated.
\*
\* The counterexample is the retention gap itself: a stamp at age 2, still
\* reported by the agent, no longer actionable by the operator, and enough to
\* start an engine under this flag.
\*
\* Only ScaleUpOnlyOnFreshDemand is listed. Every state invariant still holds:
\* the engine that comes up is at ActiveReplicas with reason WakeRequested, which
\* is well-formed -- it is just not something anybody asked for recently.

CONSTANTS
    MaxTime = 3
    WakeTTL = 2
    Retention = 3
    IdleTimeout = 2
    ActiveReplicas = 1
    IdleReplicas = 0
    UserReplicas = 2
    StoppedBeforeWake = FALSE
    WakeIgnoresTTL = TRUE
    PollIgnoresReplicas = FALSE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

PROPERTIES
    ScaleUpOnlyOnFreshDemand
