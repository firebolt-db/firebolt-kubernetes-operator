\* TLC model-checking configuration for EngineWake.tla -- the shipped design,
\* which must pass.
\*
\* Run with:
\*   java -jar tla2tools.jar -config EngineWake.cfg EngineWake.tla
\*
\* Bounds. Every one of them is the smallest value in which the hazard it exists
\* for is expressible at all, which is also what keeps TLC under a couple of
\* seconds including the liveness pass:
\*
\*   MaxTime = 3       four instants, which is what the three durations below
\*                     need to be distinguishable.
\*   WakeTTL = 2       a stamp is actionable at age 0 and 1.
\*   Retention = 3     and still reported by the agent at age 2, when the
\*                     operator will no longer act on it. That one-tick gap IS
\*                     the retention-versus-TTL separation: at age 2 the
\*                     operator can re-observe a stamp it must refuse, which is
\*                     the state ScaleUpOnlyOnFreshDemand is about.
\*   IdleTimeout = 2   so an engine can go idle within the same horizon and the
\*                     scale-down interleaves with wake rather than sitting
\*                     outside the explored behaviours.
\*
\*   ActiveReplicas = 1, IdleReplicas = 0, UserReplicas = 2. The replica count
\*   is a three-level abstraction, not a number: parked, the level auto-stop
\*   scales to, and a level it never chooses. UserReplicas is only reachable as
\*   an initial condition, because that is the only way a count auto-stop did
\*   not pick can exist.
\*
\* Every counterexample flag is FALSE here: this config checks the design as it
\* ships. Each one has an EngineWakeNaive*.cfg that flips it and pins the
\* resulting violation; see formal/counterexamples.tsv.

CONSTANTS
    MaxTime = 3
    WakeTTL = 2
    Retention = 3
    IdleTimeout = 2
    ActiveReplicas = 1
    IdleReplicas = 0
    UserReplicas = 2
    StoppedBeforeWake = FALSE
    WakeIgnoresTTL = FALSE
    PollIgnoresReplicas = FALSE

SPECIFICATION Spec

\* The clock is bounded, so behaviours end in a stuttering suffix once `now`
\* reaches MaxTime and nothing else is enabled. That is the model's horizon, not
\* a wedged protocol.
CHECK_DEADLOCK FALSE

INVARIANTS
    Safety

PROPERTIES
    ScaleUpOnlyOnFreshDemand
    RunningEngineOnlyScalesToIdle
    WakeIsNotLost
    FreshDemandWakesOrExpires
