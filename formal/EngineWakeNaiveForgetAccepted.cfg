\* Cache eviction must not erase an accepted wake's protection.
CONSTANTS
    MaxTime = 3
    WakeTTL = 2
    Retention = 3
    IdleTimeout = 1
    ActiveReplicas = 1
    IdleReplicas = 0
    UserReplicas = 2
    StoppedBeforeWake = FALSE
    WakeIgnoresTTL = FALSE
    PollIgnoresReplicas = FALSE
    ForgetAcceptedWake = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS Inv_AcceptedWakeProtected
