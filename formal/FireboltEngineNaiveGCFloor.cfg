\* TLC configuration for FireboltEngine.tla with GC's generation floor REMOVED --
\* this configuration MUST FAIL.
\*
\* GCIgnoresGenerationFloor = TRUE drops the `g < NewestKept(gcView)` conjunct
\* from GCOrphans, modelling a sweep that trusts its keep set to be current.
\*
\* The keep set is built from a status read, and GCOrphans is free to observe any
\* gcView up to the real currentGeneration, because a cached read lags the writes
\* of earlier passes under generation churn. Without the floor, such a pass takes
\* the generation being created for an orphan and deletes its StatefulSet. The
\* reconciler re-creates what is missing, the generation moves on again, the view
\* falls further behind, and the engine never converges. TLC reports:
\*
\*   Action property NoDeleteOfCurrentGeneration is violated.
\*
\* An action property rather than an invariant, and that is the whole point: an
\* engine destroyed mid-creation leaves every state invariant of this spec intact,
\* so no invariant would have caught the hazard, and the implementation shipped
\* it. EventuallyTerminal does not catch it either, because the reconciler
\* re-creates what the sweep removed and strong fairness carries the model to a
\* terminal phase regardless.
\*
\* No INVARIANTS: the pinned failure is the action property, and naming one thing
\* is what makes a negative control control for something specific.

CONSTANTS
    MaxGen = 3
    MaxSpec = 4
    SwitchWithoutService = FALSE
    GCIgnoresActiveGen = FALSE
    GCDrainingGeneration = FALSE
    GCIgnoresGenerationFloor = TRUE
    AdvanceWithoutMatchingSTS = FALSE
    DriftDuringDrain = FALSE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

PROPERTIES
    NoDeleteOfCurrentGeneration
