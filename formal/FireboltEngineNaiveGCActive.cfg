\* TLC configuration for FireboltEngine.tla with GC's active-generation
\* exclusion REMOVED -- this configuration MUST FAIL.
\*
\* GCIgnoresActiveGen = TRUE drops `g # activeGen` from GCOrphans, modelling an
\* implementation whose keepGens set holds only CurrentGeneration and
\* DrainingGeneration.
\*
\* Those two are sufficient in a terminal phase -- there, currentGen = activeGen
\* and there is nothing draining. They are NOT sufficient mid-rollout: between
\* the generation bump and the cutover the still-serving generation is activeGen,
\* which is neither currentGen (the new one being built) nor drainingGen (not set
\* until switching completes). So the sweep deletes the StatefulSet that traffic
\* is currently landing on. TLC reports:
\*
\*   Invariant Inv_ActiveHasSTS is violated.
\*
\* This is what buys the sweep its freedom from a phase gate. Gating it on
\* phase in {PhaseStable, PhaseStopped} would hide the hazard, at the cost of
\* never sweeping the engines that need it: an engine whose pods never become
\* ready, or whose spec keeps drifting, abandons generation after generation
\* without ever reaching a terminal phase.
\*
\* Only Inv_ActiveHasSTS is listed, not Safety: with `INVARIANTS Safety` TLC
\* prints only "Invariant Safety is violated" with no attribution. See
\* formal/counterexamples.tsv.
\*
\* No PROPERTIES and CHECK_DEADLOCK FALSE: a spec that violates safety says
\* nothing useful about progress.

CONSTANTS
    MaxGen = 3
    MaxSpec = 4
    SwitchWithoutService = FALSE
    GCIgnoresActiveGen = TRUE
    GCDrainingGeneration = FALSE
    GCIgnoresGenerationFloor = FALSE
    AdvanceWithoutMatchingSTS = FALSE
    DriftDuringDrain = FALSE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
    Inv_ActiveHasSTS
