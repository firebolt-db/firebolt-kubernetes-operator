              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: "FireboltEnginePresetSpec is the ambient, namespace-level
              engine\noverlay. Every FireboltEngine in the same namespace merges these\nfields
              underneath its own spec and above any referenced\nFireboltEngineClass:\n\n\tengine
              spec > FireboltEnginePreset > FireboltEngineClass > operator default\n\nA
              namespace holds at most one FireboltEnginePreset: the CRD CEL\nrule
              on the root object pins metadata.name to\nFireboltEnginePresetDefaultName
              (\"firebolt\"), so apiserver name\nuniqueness makes a second object
              impossible. The object is not\nselected by engines: customers keep referencing
              a class name (or no\nclass).\n\nThe carried fields are the namespace-resolved
              identifiers and\nconfig fragments that are shared by every engine in
              the namespace\n(service account, credential env, storage, customEngineConfig).\nSKU-shaped
              settings (resources, instance type, rollout, autoStop,\nuiSidecar) stay
              on FireboltEngineClass."
            properties:
              customEngineConfig:
                description: |-
                  CustomEngineConfig is deep-merged into the rendered config.yaml
                  after the class config and before the engine config: operator
                  defaults, then class, then this Preset object, then the engine
                  (engine keys win on conflict). Operator-owned paths are stripped
                  before the merge, as they are from the class and the engine.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              storage:
                default: {}
                description: |-
                  Storage is the default per-pod data-volume configuration for
                  engines in this namespace that do not declare a storage backend
                  of their own. An engine that sets any backend on spec.storage
                  owns its storage wholesale; otherwise this value applies, then
                  the referenced class, then the operator default (emptyDir).
                properties:
                  emptyDir:
                    description: |-
                      EmptyDir backs the engine's data mount with a pod-scoped emptyDir
                      Volume. The mount holds regenerable cache only; authoritative
                      data lives in the metadata service and the managed-table S3
                      bucket (see EngineStorageSpec for the full picture), so volume
                      contents being lost on pod restart is normal engine behavior
                      rather than a durability regression.
                    properties:
                      medium:
                        description: |-
                          Medium is the storage medium backing the emptyDir. Leave empty
                          for the default node disk; set to "Memory" for a tmpfs-backed
                          volume sized against the pod's memory limit.
                        enum:
                        - ""
                        - Memory
                        type: string
                      sizeLimit:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          SizeLimit caps the volume's growth. Optional; nil means
                          unbounded (subject to node disk pressure or pod memory limits
                          for Memory medium).
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
                  hostPath:
                    description: |-
                      HostPath backs the engine's data mount with a directory on the
                      node filesystem. Pods are implicitly node-pinned (the directory only
                      exists where it was created); the path must pre-exist on every
                      node the engine pod could be scheduled onto, with permissions
                      readable by the engine web UID. Use to expose instance-store NVMe on
                      the node.
                    properties:
                      path:
                        description: Path is the absolute filesystem path on the host
                          node.
                        pattern: ^/.*
                        type: string
                      type:
                        description: |-
                          Type enforces a check on Path before mounting (Directory,
                          DirectoryOrCreate, …). See
                          https://kubernetes.io/docs/concepts/storage/volumes/#hostpath
                          for the full enum. Leave nil to skip the check (kubelet default).
                        type: string
                    required:
                    - path
                    type: object
                  persistentVolumeClaim:
                    description: |-
                      PersistentVolumeClaim opts the engine into a per-pod
                      PersistentVolumeClaim synthesized by the StatefulSet controller
                      from a VolumeClaimTemplate. Set the field (even to an empty
                      struct) to enable the PVC backend; the kubebuilder defaults
                      (1Gi, ReadWriteOnce, cluster-default StorageClass) on
                      EnginePersistentVolumeClaimSpec fill in any omitted inner field.
                      When this field is nil the engine falls back to the default
                      emptyDir backend (see the EngineStorageSpec doc above).
                    properties:
                      accessModes:
                        default:
                        - ReadWriteOnce
                        description: |-
                          AccessModes for the PVC. Defaults to [ReadWriteOnce], which matches the
                          per-pod ownership model used by the StatefulSet VolumeClaimTemplate.
                        items:
                          type: string
                        type: array
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 1Gi
                        description: Size is the requested capacity for each engine
                          pod's PVC. Defaults to 1Gi.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storageClassName:
                        description: |-
                          StorageClassName selects the StorageClass for the PVC. Leave nil to use
                          the cluster default. An empty string disables dynamic provisioning.
                        type: string
                    type: object
                type: object
                x-kubernetes-validations:
                - message: storage.persistentVolumeClaim, storage.emptyDir, and storage.hostPath
                    are mutually exclusive
                  rule: '(has(self.persistentVolumeClaim) ? 1 : 0) + (has(self.emptyDir)
                    ? 1 : 0) + (has(self.hostPath) ? 1 : 0) <= 1'
