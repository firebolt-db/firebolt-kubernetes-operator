name: Tests

on:
  pull_request:

permissions: {}

jobs:
  detect:
    name: Detect test shortcut
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip_test: ${{ steps.detect.outputs.skip_test }}
      skip_reason: ${{ steps.detect.outputs.skip_reason }}
    steps:
      - name: Determine whether the PR can skip unit tests
        id: detect
        env:
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          write_outputs() {
            {
              echo "skip_test=$1"
              echo "skip_reason=$2"
            } >> "$GITHUB_OUTPUT"
          }

          # Trusted release-please PRs only rewrite release metadata
          # (version.txt / CHANGELOG / manifest / chart version fields).
          # Require same-repo head + the release writer bot so a fork or
          # hand-rolled branch named like release-please still runs tests.
          if [[ "${HEAD_REF}" == release-please--* && "${HEAD_REPO}" == "${REPO}" && "${PR_AUTHOR}" == "fireboltdb-ci-writer[bot]" ]]; then
            echo "Trusted release-please branch '${HEAD_REF}'; skipping unit-test worker."
            write_outputs true release_please
            exit 0
          fi

          write_outputs false ""

  test:
    name: Run on Ubuntu (${{ matrix.variant }})
    needs: detect
    if: needs.detect.outputs.skip_test != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Run the unit suite under both image variants so a bump to
      # config/images/defaults.latest.env is gated by the same tests as the
      # implicit-default `dev` build. `fail-fast: false` keeps one variant's
      # failure from cancelling the other, so a variant-specific regression
      # stays visible.
      fail-fast: false
      matrix:
        variant: [dev, latest]
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # `make test` runs once per image variant (see the matrix above):
      # `dev` tracks the mutable `:dev` aliases, `latest` pins to the
      # release-* build in config/images/defaults.latest.env. Both gate
      # every PR, so a bump to defaults.latest.env is validated here too.
      - name: Running Tests (${{ matrix.variant }} variant)
        run: |
          go mod tidy
          make test IMAGE_VARIANT=${{ matrix.variant }}
        env:
          GOPRIVATE: github.com/firebolt-db/*

      # The outer-Reconcile rapid harness (build tag `outerharness`) drives the
      # real reconciler against envtest, so it catches CRD/admission regressions
      # that the pure-function property test and `make test` miss — e.g. the
      # k8s 1.36 `spec.template.spec.containers: Required value` rejection.
      #
      # `make test-property` builds with `-tags outerharness` only — it never
      # adds the `latest` tag, so the image variant does not change what it
      # exercises. Run it once (on the `dev` leg) instead of duplicating it
      # across the matrix.
      - name: Running outer-Reconcile property tests
        if: matrix.variant == 'dev'
        run: make test-property
        env:
          GOPRIVATE: github.com/firebolt-db/*

  # Single stable required-check name for branch protection. Matrix legs
  # (Run on Ubuntu (dev/latest)) are not reliably emitted as per-combination
  # checks when skipped, so a trusted release-please PR would leave them
  # Pending and block the merge. This gate runs `if: always()`, collapses
  # both matrix legs into one `needs.test.result`, and fails closed if
  # `detect` itself failed. An intentional skip must set skip_test=true.
  unit-tests:
    name: Unit Tests
    needs: [detect, test]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify gated jobs
        env:
          DETECT: ${{ needs.detect.result }}
          SKIP_TEST: ${{ needs.detect.outputs.skip_test }}
          SKIP_REASON: ${{ needs.detect.outputs.skip_reason }}
          TEST: ${{ needs.test.result }}
        run: |
          if [ "$DETECT" != "success" ]; then
            echo "::error::detect did not succeed (result=$DETECT)"; exit 1
          fi
          case "$TEST" in
            success)
              echo "gate satisfied (test=$TEST)"
              ;;
            skipped)
              if [ "$SKIP_TEST" = "true" ]; then
                echo "gate satisfied (test=skipped, reason=$SKIP_REASON)"
              else
                echo "::error::test was skipped but skip_test=$SKIP_TEST"; exit 1
              fi
              ;;
            *)
              echo "::error::test result=$TEST"; exit 1
              ;;
          esac
