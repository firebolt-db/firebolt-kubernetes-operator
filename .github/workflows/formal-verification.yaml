name: Formal Verification

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  detect:
    name: Detect formal-relevant change
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - name: Determine whether formal specs/fixture changed
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # On non-pull_request events (push to main) always run.
          # On a PR, TLC's result depends only on the TLA+ specs, the
          # fixture generator, and the generated fixture — not docs and
          # not most Go changes. Fail-safe: any uncertainty -> true.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(gh api --paginate \
            "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" \
            --jq '.files[].filename' 2>/dev/null || true)"
          printf '%s\n' "${files:-<none>}"
          if [ -z "${files}" ]; then echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if printf '%s\n' "${files}" \
            | grep -qE '^formal/|^scripts/gen-tla-[a-z-]*state-tests\.py$|_tla_states_data_test\.go$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  tlc:
    name: TLC
    needs: detect
    if: needs.detect.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache TLA+ tools
        id: cache-tla
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tla2tools.jar
          key: tla2tools-v1.8.0

      - name: Download TLA+ tools
        if: steps.cache-tla.outputs.cache-hit != 'true'
        run: |
          wget -q -O tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar

      - name: Run TLC — FireboltEngine
        run: |
          java -cp tla2tools.jar tlc2.TLC \
            -workers 2 \
            -config formal/FireboltEngine.cfg \
            formal/FireboltEngine.tla

      - name: Run TLC — FireboltInstance
        run: |
          java -cp tla2tools.jar tlc2.TLC \
            -workers 2 \
            -config formal/FireboltInstance.cfg \
            formal/FireboltInstance.tla

      - name: Run TLC — SigningKeyRotation
        run: |
          java -cp tla2tools.jar tlc2.TLC \
            -workers 2 \
            -config formal/SigningKeyRotation.cfg \
            formal/SigningKeyRotation.tla

      - name: Run TLC — SigningKeyRotation naive anchor must still fail
        run: |
          # Requires TLC's specific violation line rather than a non-zero exit:
          # a parse error or OOM also exits non-zero and would otherwise pass.
          out="$(java -cp tla2tools.jar tlc2.TLC -workers 2 -nowarning \
            -config formal/SigningKeyRotationNaive.cfg \
            formal/SigningKeyRotation.tla 2>&1 || true)"
          if echo "$out" | grep -q 'Invariant NoValidationGap is violated'; then
            echo "OK: the naive retain-window anchor still violates NoValidationGap"
          else
            echo "::error::SigningKeyRotationNaive.cfg no longer produces the expected NoValidationGap violation"
            echo "$out" | tail -40
            exit 1
          fi

      - name: Verify state-cover fixtures are up to date
        run: |
          # Reuse the cached tla2tools.jar at the location the Makefile expects.
          mkdir -p bin
          cp tla2tools.jar bin/tla2tools.jar
          # formal-verify regenerates every fixture and diffs them all, so CI and
          # the Makefile cannot disagree about which specs are covered.
          make formal-verify

  # Single stable required-check name for branch protection. Keeping the
  # required name "TLC model checker" on this gate (the worker job is now
  # "TLC") means branch protection does not change for TLC. The gate runs
  # `if: always()`, passes when the path-scoped worker was `success` or
  # (intentionally) `skipped`, and fails closed if `detect` failed.
  tlc-required:
    name: TLC model checker
    needs: [detect, tlc]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify gated jobs
        env:
          DETECT: ${{ needs.detect.result }}
          TLC: ${{ needs.tlc.result }}
        run: |
          if [ "$DETECT" != "success" ]; then
            echo "::error::detect did not succeed (result=$DETECT)"; exit 1
          fi
          case "$TLC" in
            success|skipped) echo "gate satisfied (tlc=$TLC)";;
            *) echo "::error::tlc result=$TLC"; exit 1;;
          esac
