# Runs `make prepare-test-e2e` + `make local-deploy` from the PR
# branch (operator binary + Helm chart on branch), then apply example manifests.
# The unit tests and e2e test CI do not deploy the operator via Helm (E2E runs in-process with
# cluster-admin), so chart RBAC/install regressions would otherwise slip through.
name: Test Helm

on:
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: test-helm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect expensive-test shortcut
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      release_please: ${{ steps.detect.outputs.release_please }}
      skip_expensive: ${{ steps.detect.outputs.skip_expensive }}
      skip_reason: ${{ steps.detect.outputs.skip_reason }}
    steps:
      - name: Determine whether the PR can skip Kind tests
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          write_outputs() {
            {
              echo "docs_only=$1"
              echo "release_please=$2"
              echo "skip_expensive=$3"
              echo "skip_reason=$4"
            } >> "$GITHUB_OUTPUT"
          }

          # Trusted release-please PRs only rewrite release metadata
          # (version.txt / CHANGELOG / manifest / chart version fields).
          # Require same-repo head + the release writer bot so a fork or
          # hand-rolled branch named like release-please still runs Kind.
          if [[ "${HEAD_REF}" == release-please--* && "${HEAD_REPO}" == "${REPO}" && "${PR_AUTHOR}" == "fireboltdb-ci-writer[bot]" ]]; then
            echo "Trusted release-please branch '${HEAD_REF}'; skipping Kind-backed worker."
            write_outputs false true true release_please
            exit 0
          fi

          # List the PR's changed files via the compare API (no checkout
          # needed). "docs" = markdown anywhere, plus docs/.
          # Fail-safe: any uncertainty leaves skip_expensive=false so the
          # full suite still runs.
          files="$(gh api --paginate \
            "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" \
            --jq '.files[].filename' 2>/dev/null || true)"
          echo "Changed files:"
          printf '%s\n' "${files:-<none>}"
          non_docs="$(printf '%s\n' "${files}" \
            | grep -vE '\.mdx?$|^docs/' || true)"
          if [ -n "${files}" ] && [ -z "${non_docs}" ]; then
            write_outputs true false true docs_only
          else
            write_outputs false false false ""
          fi

  test-helm:
    name: test-helm
    needs: detect
    if: needs.detect.outputs.skip_expensive != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      KIND_CLUSTER: test-helm-quickstart
    steps:
      - name: Clean Up Disk Space on public GitHub Runner
        if: runner.os == 'Linux'
        run: |
          df -h /

          # Unused tool caches (comment any required ones with #)
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/julia* /usr/share/miniconda /usr/local/share/boost

          # Browsers + drivers + playwright cache
          sudo apt-get purge -y --auto-remove \
            firefox google-chrome-stable microsoft-edge-stable || true
          sudo rm -rf \
            /usr/local/share/chromedriver-linux64 \
            /usr/local/share/chromium \
            /root/.cache/ms-playwright \
            /home/runner/.cache/ms-playwright

          # Preinstalled Docker images and build cache
          docker image prune -af || true
          docker builder prune -af || true

          df -h /

      - name: Raise memlock limit for kind nodes (engine io_uring)
        run: |
          sudo mkdir -p /etc/systemd/system/docker.service.d
          sudo tee /etc/systemd/system/docker.service.d/memlock.conf > /dev/null <<'EOF'
          [Service]
          LimitMEMLOCK=infinity
          EOF
          sudo mkdir -p /etc/docker
          sudo tee /etc/docker/daemon.json > /dev/null <<'EOF'
          {
            "default-ulimits": {
              "memlock": { "Name": "memlock", "Hard": -1, "Soft": -1 }
            }
          }
          EOF
          sudo systemctl daemon-reload
          sudo systemctl restart docker

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version and SHA-256 live in scripts/ci/pinned-tools.tsv; the helper
      # refuses to write ./kind unless the digest matches.
      - name: Install kind
        run: |
          scripts/ci/fetch-verified.sh kind ./kind
          sudo install -m 0755 ./kind /usr/local/bin/kind
          rm -f ./kind

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install yq
        run: |
          scripts/ci/fetch-verified.sh yq ./yq
          sudo install -m 0755 ./yq /usr/local/bin/yq
          rm -f ./yq
          yq --version

      - name: Prepare Kind cluster and workload images
        run: |
          go mod tidy
          make prepare-test-e2e KIND_CLUSTER="${KIND_CLUSTER}"
        env:
          GOPRIVATE: github.com/firebolt-db/*

      # Guards the CRDs against regrowing past Helm's 1 MiB release-Secret
      # cap. Runs before the operator chart so these cluster-scoped CRDs
      # are not already present; the script installs the dedicated CRD chart,
      # waits for the CRDs to be Established, then uninstalls.
      - name: Verify CRD chart installs under Helm's 1 MiB Secret cap
        run: make helm-test-crds KIND_CLUSTER="${KIND_CLUSTER}"

      - name: Build operator image and Helm upgrade (branch chart + binary)
        run: make local-deploy KIND_CLUSTER="${KIND_CLUSTER}"
        env:
          GOPRIVATE: github.com/firebolt-db/*

      - name: Run helm-test target
        run: make helm-test

      # Only place in CI that starts the operator-injected engine-web
      # container against the real (mutable :latest) UI image, so a UI image
      # regression against the injected pod spec surfaces here.
      - name: Verify engine web UI sidecar
        run: make helm-test-ui KIND_CLUSTER="${KIND_CLUSTER}"

      - name: Verify wake-on-zero
        # The only check that exercises the real wake path: a chart-installed
        # operator means the wake-agent sidecar runs from the actual operator
        # image, inside the gateway pod, where Envoy's loopback call can reach
        # it. The Go e2e suite runs the operator in-process and cannot.
        run: make helm-test-wake KIND_CLUSTER="${KIND_CLUSTER}"

      - name: Verify website quickstart bundle
        run: make helm-test-website KIND_CLUSTER="${KIND_CLUSTER}"

  # Single stable required-check name for branch protection. `test-helm`
  # is a single job that already reports success when skipped, but this
  # gate closes the `detect` fail-open hole (a failed `detect` would skip
  # the heavy job and report a false success) and gives branch protection
  # one stable name independent of the worker job. An intentional skip must
  # set skip_expensive=true (docs-only or trusted release-please).
  helm-required:
    name: Helm Tests
    needs: [detect, test-helm]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify gated jobs
        env:
          DETECT: ${{ needs.detect.result }}
          SKIP_EXPENSIVE: ${{ needs.detect.outputs.skip_expensive }}
          SKIP_REASON: ${{ needs.detect.outputs.skip_reason }}
          HELM: ${{ needs.test-helm.result }}
        run: |
          if [ "$DETECT" != "success" ]; then
            echo "::error::detect did not succeed (result=$DETECT)"; exit 1
          fi
          case "$HELM" in
            success)
              echo "gate satisfied (test-helm=$HELM)"
              ;;
            skipped)
              if [ "$SKIP_EXPENSIVE" = "true" ]; then
                echo "gate satisfied (test-helm=skipped, reason=$SKIP_REASON)"
              else
                echo "::error::test-helm was skipped but skip_expensive=$SKIP_EXPENSIVE"; exit 1
              fi
              ;;
            *)
              echo "::error::test-helm result=$HELM"; exit 1
              ;;
          esac
